# Builds the Android debug APK (for manual device tests) — started by hand via "Run workflow".
# Uses the project's own tooling: npm lockfile, `npm test`, `npm run android:sync`
# (= typecheck + production build + cap sync) and the Gradle wrapper in android/.
# Versions follow the project: Node 22, Java 21 (Capacitor 8), Gradle wrapper 8.14.3, compileSdk 36.
# No release key: the APK is signed with the runner's generated debug key.
name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Unit-Tests vor dem Build ausführen'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (lockfile)
        run: npm ci
        env:
          # Browser tests are not run here; no browser downloads needed.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Unit tests
        if: ${{ inputs.run_tests }}
        run: npm test

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ('tools') no longer exists in current SDK command-line tools.
          # Only what the project needs: platform tools + compileSdk 36; Gradle fetches the rest.
          packages: 'platform-tools platforms;android-36'

      - name: Set up Gradle (wrapper from android/, with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Typecheck, production build and Capacitor sync
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK (branch, commit, build type)
        id: apk
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          name="one-line-art-${branch}-${GITHUB_SHA::7}-debug"
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/${name}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: out/${{ steps.apk.outputs.name }}.apk
          if-no-files-found: error
          retention-days: 14
